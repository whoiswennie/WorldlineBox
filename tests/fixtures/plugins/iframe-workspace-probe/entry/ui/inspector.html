<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inspector iframe probe</title>
    <style>
      :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
      body { background: var(--worldlinebox-canvas, #252729); color: var(--worldlinebox-text, #f1f2ef); margin: 0; padding: 24px; }

  <body>
    <h1>Sandboxed inspector view</h1>
