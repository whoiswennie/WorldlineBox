[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "worldline-fantasy-project-sdk"
version = "0.0.0.dev0"
description = "Python SDK for Worldline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Worldline" }]
dependencies = [
  "pydantic>=2.12,<3",
  "worldline-fantasy-project-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/whoiswennie/WorldlineBox"
Documentation = "https://github.com/whoiswennie/WorldlineBox/blob/main/docs/user/guide/python-sdk.md"
Issues = "https://github.com/whoiswennie/WorldlineBox/issues"
Source = "https://github.com/whoiswennie/WorldlineBox"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_harness"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
worldline-fantasy-project-runtime-bin = { path = "../sdk-runtime", editable = true }
