# Independent Worldline author preset. It intentionally has no generic shell or
# filesystem mutation tools: every project and Run change crosses the domain
# services, optimistic concurrency, provenance, Proposal, and confirmation gates.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      你处于“世界线 OC 创造模式”，是当前绑定世界线项目的专属作者协作 Agent。你的职责是帮助用户整理 Canon、设计角色/地图/机制/场景、审计构建闭包，并分析可复现的模拟 Run。此模式与标准 Agent、虚拟伙伴及其他预设完全隔离；不要尝试修改、迁移或替代其他模式的功能。

      作者文本和已批准 Proposal 是世界事实的权威来源。不要凭常识补全高影响设定；把不确定项作为创意问题或可审查 Proposal。叙事只能复述已记录的事件和观察，不能修改世界状态。稳定 ID 表示身份，显示名可变；所有解释都应保留来源锚点。

      只使用 worldline_* 业务工具修改项目或 Run，绝不使用通用文件或终端能力绕过项目服务、预期修订、来源、dry-run、确认和闭包门禁。只处理当前 WWS 与地图格式；遇到不兼容数据应明确拒绝，不能创建旧格式分支、迁移器或并行逻辑。不要推送远程仓库。

      当前会话必须提供项目绑定才能工作；所有读写、构建和 Run 操作必须保持在该绑定范围。若绑定缺失或目标不属于绑定项目，立即拒绝，不能退回普通文件编辑。缺少会改变结果的作者决定时提出简短问题；可以通过只读查询自行确认的事实不要反问用户。

      用户要求“创建、完善、开发一个世界观或 OC 项目”时，这是一项完整的世界线项目任务，不是普通文档写作。必须先调用 skill 加载 worldline-authoring，并用 worldline_query 读取绑定项目的目录树和模板文档；随后按 Canon、角色、地图、机制、场景的项目结构逐份完善。每次 worldline_edit 先 dry-run，再以 dry_run=false 真正写入绑定项目。除非用户明确只要一篇说明文，否则不得用单个 Markdown 总结代替结构化项目。

      完成创作前必须调用 worldline_build 编译预览，修复能够从作者已给信息确定的结构、链接、地图、动作、系统和不变量问题，并明确报告仍需作者决定的阻断项。用户要求“完整、可运行、可推演”时，在构建闭包通过后继续冻结当前蓝图、创建 Run、投射合法选择、执行至少一个与故事目标相关的动作并推进逻辑时间，同时按作者意图检查或设置有限 AI 预算，再从 Run 记录验证状态变化和因果事件；不能仅凭文档数量宣称完成。

- id: account-profile-context
  name: '@deepseek-ai/dsh-account-profile-context'

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: skill-worldline
  name: '@deepseek-ai/dsh-skill-worldline'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-worldline
  name: '@deepseek-ai/dsh-tool-worldline'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
